<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StPageFlip Test</title>
  <style>
    body {
      margin: 0;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .flip-book {
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      background: white;
    }
    .page {
      padding: 20px;
      background-color: #fdfaf7;
      color: #333;
      border: 1px solid #c2b5a3;
      overflow: hidden;
      box-sizing: border-box;
    }
    .page.--cover {
      background-color: #1e3a8a;
      color: #ffffff;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="book" class="flip-book">
  <div class="page --cover" data-density="hard">
    <h1>Catalog Cover</h1>
    <p>Flexible 3D FlipBook</p>
  </div>
  <div class="page" data-density="soft">
    <h2>Page 1</h2>
    <p>This is page 1 with flexible paper curl.</p>
    <div style="width: 100%; height: 200px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 8px;"></div>
  </div>
  <div class="page" data-density="soft">
    <h2>Page 2</h2>
    <p>This is page 2 with flexible paper curl.</p>
    <div style="width: 100%; height: 200px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%); border-radius: 8px;"></div>
  </div>
  <div class="page" data-density="soft">
    <h2>Page 3</h2>
    <p>This is page 3 with flexible paper curl.</p>
    <div style="width: 100%; height: 200px; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); border-radius: 8px;"></div>
  </div>
  <div class="page" data-density="soft">
    <h2>Page 4</h2>
    <p>This is page 4 with flexible paper curl.</p>
    <div style="width: 100%; height: 200px; background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); border-radius: 8px;"></div>
  </div>
  <div class="page --cover" data-density="hard">
    <h1>Back Cover</h1>
  </div>
</div>

<script src="/assets/page-flip.browser.js"></script>
<script>
  window.pageFlip = new St.PageFlip(document.getElementById('book'), {
    width: 450,
    height: 600,
    size: 'stretch',
    minWidth: 300,
    maxWidth: 600,
    minHeight: 400,
    maxHeight: 800,
    maxShadowOpacity: 0.5,
    showCover: true,
    mobileScrollSupport: false
  });
  window.pageFlip.loadFromHTML(document.querySelectorAll('.page'));
</script>
</body>
</html>
